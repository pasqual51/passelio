name: Alpha checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check static/app.js
      - run: node --check static/admin.js
      - run: node --check static/mail.js
      - run: node --check static/system.js
      - run: node --check static/branding.js
      - run: node --check static/accounts.js
      - run: node --check static/features.js
      - run: node --check static/home.js
      - run: pip-audit -r requirements.txt
      - run: docker build -t passelio:ci .
      - run: python scripts/load_check.py
  container:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/initial-alpha'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Build versioned alpha image
        run: docker build --label org.opencontainers.image.source=https://github.com/pasqual51/passelio --label org.opencontainers.image.licenses=AGPL-3.0-only --label org.opencontainers.image.revision=${{ github.sha }} -t ghcr.io/pasqual51/passelio:0.1.0-alpha.12 -t ghcr.io/pasqual51/passelio:sha-${{ github.sha }} .
      - name: Publish alpha image
        run: |
          docker push ghcr.io/pasqual51/passelio:0.1.0-alpha.12
          docker push ghcr.io/pasqual51/passelio:sha-${{ github.sha }}
